name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'

    - name: Show build environment
      run: |
        xcodebuild -version
        swift --version

    - name: Build and Archive
      run: |
        cd ios

        # Build with ad-hoc signing to include Swift libraries
        xcodebuild archive \
          -project MosmeCheat.xcodeproj \
          -scheme MosmeCheat \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/MosmeCheat.xcarchive \
          CODE_SIGN_IDENTITY="-" \
          -allowProvisioningUpdates

    - name: Create IPA with Swift Libraries
      run: |
        cd ios
        mkdir -p build/ipa build/Payload

        # Find .app bundle
        APP_PATH=$(find build/MosmeCheat.xcarchive -name "*.app" -type d | head -n 1)

        if [ -z "$APP_PATH" ]; then
          echo "Error: .app bundle not found"
          exit 1
        fi

        echo "Found app at: $APP_PATH"

        # Copy app bundle
        cp -r "$APP_PATH" build/Payload/

        # Copy Swift standard libraries from Xcode
        SWIFT_LIBS_PATH="/Applications/Xcode_15.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
        if [ -d "$SWIFT_LIBS_PATH" ]; then
          echo "Copying Swift libraries..."
          mkdir -p "build/Payload/MosmeCheat.app/Frameworks"

          # Copy essential Swift libraries
          for lib in libswiftCore.dylib libswiftFoundation.dylib libswiftObjectiveC.dylib \
                     libswiftUIKit.dylib libswiftWebKit.dylib libswiftDispatch.dylib \
                     libswiftCoreFoundation.dylib libswiftCoreGraphics.dylib \
                     libswiftDarwin.dylib libswift_Concurrency.dylib; do
            if [ -f "$SWIFT_LIBS_PATH/$lib" ]; then
              cp "$SWIFT_LIBS_PATH/$lib" "build/Payload/MosmeCheat.app/Frameworks/"
            fi
          done
        fi

        # Create IPA
        cd build
        zip -r MosmeCheat-unsigned.ipa Payload
        mv MosmeCheat-unsigned.ipa ipa/MosmeCheat.ipa

        # Show info
        echo "IPA size:"
        ls -lh ipa/MosmeCheat.ipa
        echo ""
        echo "IPA contents:"
        unzip -l ipa/MosmeCheat.ipa | head -30

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MosmeCheat-iOS-unsigned
        path: ios/build/ipa/MosmeCheat.ipa
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ios/build/ipa/MosmeCheat.ipa
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
